<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa interactivo — Mapa de genocidios</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d2329;--muted:#66707a;--line:#dfe3e6;--accent:#7b1e2b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:21px}
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 59px);min-height:560px}
.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.controls{padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.97);z-index:5}
input,select{width:100%;padding:10px 11px;border:1px solid #cfd5da;border-radius:8px;font-size:14px;background:white;margin-bottom:8px}
.count{font-size:12px;color:var(--muted);margin:3px 0 8px}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#f5ecee}
.item strong{display:block;font-size:14px;margin-bottom:4px}.item small{color:var(--muted)}
#map{min-width:0;min-height:560px}.legend{padding:10px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.popup h3{margin:0 0 5px;font-size:16px}.popup .period{color:var(--accent);font-weight:650;margin-bottom:8px}
.popup p{margin:0;line-height:1.45;font-size:13px}.leaflet-popup-content{max-width:360px}
@media(max-width:800px){.layout{grid-template-columns:1fr;height:auto}.sidebar{max-height:48vh;border-right:0;border-bottom:1px solid var(--line)}#map{height:52vh;min-height:420px}}
</style>
</head>
<body>
<header><h1>Mapa de genocidios</h1></header>
<div class="layout">
<aside class="sidebar"><div class="controls">
<input id="search" type="search" placeholder="Buscar pueblo, lugar o texto…">
<select id="region"><option value="">Todas las regiones</option></select>
<div class="count" id="count"></div></div>
<div class="legend">
<span class="dot" style="background:#8b2635"></span> América &nbsp;
<span class="dot" style="background:#28666e"></span> Oceanía &nbsp;
<span class="dot" style="background:#4c5c68"></span> Europa &nbsp;
<span class="dot" style="background:#a45a52"></span> Asia &nbsp;
<span class="dot" style="background:#5b6b3a"></span> África
</div><div id="list"></div></aside>
<main id="map" aria-label="Mapa interactivo"></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places = [{"name": "KINJA", "region": "AMÉRICA", "lat": -1.6565017, "lon": -61.257147, "period": "1968 - 1988", "description": "Persecución militar y masacre sistemática llevada a cabo por la dictadura militar de Brasil y la Fundación Nacional del Indio (FUNAI) durante la construcción de la carretera BR-174. El régimen utilizó bombardeos, armas químicas y emboscadas para despojar sus tierras ancestrales amazónicas, reduciendo gravemente su población."}, {"name": "PUEBLOS ORIGINARIOS DE CALIFORNIA*", "region": "AMÉRICA", "lat": 34.5107678, "lon": -118.9932141, "period": "1846 - 1873", "description": "Campaña exterminadora perpetrada por colonos estadounidenses, milicias estatales y el gobierno de California tras la Fiebre del Oro. Motivados por la ambición territorial, la búsqueda de metales y prejuicios raciales, masacraron a miles de indígenas, forzando además el trabajo esclavo de sobrevivientes y niños"}, {"name": "CHEROKEE y CHOCTAW", "region": "AMÉRICA", "lat": 35.9266285, "lon": -98.3054786, "period": "1830 - 1838", "description": "Desplazamiento forzado masivo y limpieza étnica perpetrados por el gobierno estadounidense bajo la Ley de Expulsión de Indios. El Estado utilizó coerción militar, marchas forzadas bajo condiciones climáticas extremas, epidemias y privación de alimentos para despojar a estas naciones de sus territorios ancestrales, aniquilando a una fracción masiva de su población."}, {"name": "UITOTO, MUINANE, OCAINO Y ANDOQUE", "region": "AMÉRICA", "lat": 0.362255, "lon": -74.1495452, "period": "1900 - 1912", "description": "Exterminio ejecutado por la compañía cauchera Peruvian Amazon Company liderada por Julio César Arana. Impulsado por el auge internacional de la extracción de caucho, el régimen perpetró torturas, mutilaciones, ejecuciones masivas y trabajo esclavo que aniquiló a decenas de miles de indígenas amazónicos."}, {"name": "WENDAT", "region": "AMÉRICA", "lat": 44.6379741, "lon": -84.3218874, "period": "1634 - 1650", "description": "Campaña militar destructiva perpetrada por la Confederación Iroquesa, armada por comerciantes holandeses e ingleses. Motivada por el monopolio del comercio del pieles de castor y disputas territoriales, resultó en el desarraigo, la dispersión masiva y la rápida extinción social del pueblo Wendat."}, {"name": "MEXICA", "region": "AMÉRICA", "lat": 19.7151336, "lon": -98.6048034, "period": "1519 - 1521", "description": "Masacres sistemáticas infligidas por los conquistadores españoles comandados por Hernán Cortés y sus aliados indígenas durante la conquista de Tenochtitlan. La codicia de riqueza, el control de la capital mexica y el afán de dominación desencadenaron epidemias, matanzas masivas y la destrucción total del imperio."}, {"name": "QUECHUA Y AYMARA", "region": "AMÉRICA", "lat": -5.1359041, "lon": -76.0175378, "period": "1532 - 1783", "description": "Sometimiento violento perpetrado por la Corona española y virreyes coloniales. Motivado por la explotación intensiva de plata y la hegemonía imperial, se implementó la mita minera, represión brutal de insurrecciones (como la de Túpac Amaru II) y la erradicación forzada del tejido socio-cultural nativo."}, {"name": "PEQUOT", "region": "AMÉRICA", "lat": 42.287261, "lon": -71.9516002, "period": "1636 - 1638", "description": "Conflicto armado de exterminio perpetrado por colonos puritanos de Nueva Inglaterra y sus aliados nativos (Narragansett y Mohegan). Motivados por disputas comerciales, control del territorio y tensiones religiosas, quemaron aldeas enteras (como la Masacre de Fort Mystic), vendiendo a los supervivientes como esclavos"}, {"name": "RANQUEL, PAMPA Y TEHUELCHE", "region": "AMÉRICA", "lat": -34.7597414, "lon": -62.2020674, "period": "1878 - 1885", "description": "Campaña militar conocida como la \"Campaña del Desierto\", ejecutada por el gobierno de Argentina al mando de Julio A. Roca. Motivada por la consolidación del Estado, la apropiación de tierras para la ganadería y el racismo, expulsó y eliminó sistemáticamente a las tribus pampeanas y patagónicas."}, {"name": "YOEME", "region": "AMÉRICA", "lat": 27.4407116, "lon": -109.9546656, "period": "1876 - 1910", "description": "Política de exterminio y deportación masiva perpetrada por la dictadura de Porfirio Díaz en México. Impulsada por oligarcas terratenientes para despojarlos de las fértiles tierras del río Yaqui, miles de yoemes fueron masacrados y vendidos como mano de obra esclava a las plantaciones de Yucatán."}, {"name": "ACHÉ", "region": "AMÉRICA", "lat": -23.4670889, "lon": -58.9961616, "period": "1968 - 1978", "description": "Campaña de cacería humana y limpieza étnica llevada a cabo por civiles, estancieros y fuerzas de la dictadura paraguaya de Alfredo Stroessner. El afán por ocupar la cuenca oriental del río Paraná para agronegocios motivó asesinatos masivos, apropiación de niños y cautiverio en reservas."}, {"name": "MAYA IXIL", "region": "AMÉRICA", "lat": 19.7871865, "lon": -89.1914695, "period": "1981 - 1983", "description": "Genocidio indígena perpetrado por las Fuerzas Armadas de Guatemala durante las dictaduras militares (especialmente bajo Efraín Ríos Montt). Bajo el pretexto del anticomunismo en el Conflicto Armado Interno, aplicaron una política de \"tierra arrasada\", destruyendo más de 400 aldeas mayas y masacrando comunidades enteras. Se estiman entre 100,000 y 200,000 víctimas."}, {"name": "PUEBLOS ORIGINARIOS DEL CARIBE*", "region": "AMÉRICA", "lat": 20.1146857, "lon": -73.9054553, "period": "1492 - 1518", "description": "Exterminio devastador cometido por los colonizadores españoles encabezados por Cristóbal Colón y las encomiendas del Caribe. Movidos por la codicia insaciable de oro, esclavitud y sumisión religiosa, sometieron al pueblo taíno a trabajos forzados inhumanos y masacres que acabaron prácticamente con su población."}, {"name": "MAPUCHE", "region": "AMÉRICA", "lat": -47.2717698, "lon": -70.7819262, "period": "1861 - 1883", "description": "Proceso militar conocido como la \"Ocupación de la Araucanía\", llevado a cabo por el Estado chileno. Impulsado por la expansión agrícola y el nacionalismo territorial, el ejército invasor confiscó tierras ancestrales, quemó cosechas y masacró poblados para arrinconar al pueblo mapuche en reducciones."}, {"name": "YANOMAMI", "region": "AMÉRICA", "lat": 2.8828821, "lon": -64.0385453, "period": "1980 - Presente", "description": "Persecución sistemática, despojo territorial y violencia letal perpetrados por redes de minería ilegal de oro (\"garimpeiros\"), con la complicidad u omisión estatal en Brasil y Venezuela. El régimen de invasión minera utilizó contaminación deliberada por mercurio de los ríos, destrucción de ecosistemas vitales, ataques armados y la introducción de enfermedades exógenas, diezmando gravemente a las comunidades originarias amazónicas."}, {"name": "NAHUA", "region": "AMÉRICA", "lat": 13.7322496, "lon": -88.6557475, "period": "1932", "description": "Conocida como la \"Masacre de 1932\" en El Salvador, perpetrada por el régimen militar de Maximiliano Hernández Martínez. Tras una rebelión campesina iniciada por despojos agrarios, las fuerzas armadas masacraron a decenas de miles de indígenas nahuas, reprimiendo además su lenguaje, vestimenta y tradiciones."}, {"name": "MORIORI", "region": "OCEANÍA", "lat": -40.900557, "lon": 174.885971, "period": "1835 - 1860", "description": "Genocidio y esclavización del pueblo moriori en las islas Chatham (Nueva Zelanda), perpetrados por guerreros maoríes de las tribus Ngāti Mutunga y Ngāti Tama, armados con tecnología europea. Facilitado por el compromiso moriori con el pacifismo absoluto (Nunuku), el ataque resultó en masacres, esclavitud y el exterminio del 90% de su población."}, {"name": "PUEBLOS DEL ESTRECHO DE TORRES", "region": "OCEANÍA", "lat": -14.1915922, "lon": 142.267779, "period": "1788 - Siglo XX", "description": "Despojo territorial, masacres y políticas de asimilación forzada (como las \"Generaciones Robadas\") llevadas a cabo por el Imperio Británico y el gobierno australiano. Impulsados por el principio legal de Terra Nullius y el racismo institucional, arrebataron sus tierras ancestrales, apartaron a miles de niños de sus familias y destruyeron la estructura social de sus comunidades."}, {"name": "IRLANDÉS", "region": "EUROPA", "lat": 53.7632564, "lon": -7.1036969, "period": "1845 - 1852", "description": "La Gran Hambruna (An Gorta Mór), agravada de forma sistemática por las políticas coloniales del Imperio Británico. Movidos por el dogma del libre mercado (laissez-faire) y prejuicios antibritánicos contra los católicos, los gobiernos británicos mantuvieron la exportación de alimentos fuera de Irlanda mientras un millón de personas morían de hambre y otro millón se veía forzado a emigrar.\n\nNombre: \nDescripción:"}, {"name": "ROMANÍ Y SINTI", "region": "EUROPA", "lat": 48.1730562, "lon": 3.9527855, "period": "1939 - 1945", "description": "Genocidio conocido como el Porrajmos (\"la devoración\"), perpetrado por la Alemania nazi y sus aliados fascistas en Europa. Impulsados por teorías de higiene racial y prejuicios ancestrales, los nazis persiguieron, esterilizaron, sometieron a experimentos médicos y masacraron a más de 500,000 gitanos en campos de exterminio y fusilamientos masivos.\n\nNombre: \nDescripción:"}, {"name": "UCRANIANO Y KAZAJO", "region": "EUROPA", "lat": 50.4934661, "lon": 30.5380794, "period": "1930 - 1933", "description": "Hambrunas masivas inducidas (Holodomor en Ucrania y Asharshylyq en Kazajistán), planificadas por el régimen soviético de José Stalin. Con el objetivo de imponer la colectivización forzada de la tierra y aplastar el nacionalismo campesino, el Estado requisó todo el grano y alimento existente, provocando la muerte por inanición de millones de personas.\n\nNombre: \nDescripción:"}, {"name": "JUDÍO", "region": "EUROPA", "lat": 50.9940065, "lon": 9.9854061, "period": "1933 - 1945", "description": "Genocidio industrializado llevado a cabo por el régimen nazi de Adolf Hitler en Europa. Impulsados por el antisemitismo, el supremacismo ario y el eugenismo, construyeron una red de campos de concentración y exterminio mediante los cuales asesinaron sistemáticamente a más de seis millones de judíos y millones de personas de otros grupos marginados.\n\nNombre: \nDescripción:"}, {"name": "BOSNIO, SERBIO Y CROATA", "region": "EUROPA", "lat": 44.0564627, "lon": 19.7217526, "period": "1992 - 1995", "description": "Limpiezas étnicas y genocidio (destacando la masacre de Srebrenica) perpetrados durante las Guerras de Yugoslavia, principalmente por fuerzas serbobosnias bajo el mando de Radovan Karadžić y Ratko Mladić. Movidos por un ultranacionalismo expansionista (\"la Gran Serbia\"), llevaron a cabo ejecuciones masivas, violaciones sistemáticas y desplazamientos forzados de poblaciones enteras.\n\nNombre: \nDescripción:"}, {"name": "BOSNIO MUSULMÁN", "region": "EUROPA", "lat": 41.8101472, "lon": 21.0937311, "period": "1995", "description": "En julio de 1995, durante la guerra de Bosnia (1992-1995) tras la desintegración de Yugoslavia, el ejército serbobosnio de la República Srpska comandado por Ratko Mladić asaltó el enclave de Srebrenica (declarado 'zona segura' de la ONU). En pocos días ejecutaron sistemáticamente a más de 8,000 hombres y adolescentes musulmanes bosniacos ('šehidi') y desplazaron por la fuerza a más de 25,000 mujeres y niños en una campaña de limpieza étnica.\n\nNombre: \nDescripción:"}, {"name": "CIRCASIANO y PUEBLOS DEL NORTE DE CÁUCASO", "region": "ASIA", "lat": 44.9634189, "lon": 45.0042843, "period": "1860 - 1864", "description": "Limpieza étnica y genocidio perpetrados por el Imperio Ruso bajo el mandato del zar Alejandro II al finalizar la Guerra del Cáucaso. Movido por el afán de anexión territorial y rusificación, el ejército imperial masacró a cientos de miles de circasianos, cabardinos, shapsug, natujai y ubij. Expulsó masivamente al resto de la población hacia el Imperio Otomano en barcos insalubres donde murieron por miles."}, {"name": "AINU", "region": "ASIA", "lat": 42.9979503, "lon": 141.9447498, "period": "Siglo XVI - Siglo XX", "description": "Despojo de tierras, erradicación cultural y asimilación forzada perpetrados por el gobierno del Imperio del Japón durante la Restauración Meiji. Motivados por el afán de anexión de la isla de Hokkaido y la homogenización nacional, prohibieron sus prácticas culturales, idioma y caza tradicional, despojándolos de sus derechos ancestrales."}, {"name": "GRIEGO PÓNTICO", "region": "ASIA", "lat": 40.6399776, "lon": 40.498921, "period": "1914 - 1923", "description": "Genocidio y limpiezas étnicas cometidas por el régimen de los Jóvenes Turcos y el posterior movimiento nacionalista turco en el Imperio Otomano. Impulsados por una ideología de turquificación y homogeneidad religiosa, sometieron a cientos de miles de griegos a marchas de la muerte, ejecuciones masivas y deportaciones forzadas."}, {"name": "ASIRIO, CALDEO, ARAMEO Y SIRÍACO", "region": "ASIA", "lat": 39.0291611, "lon": 39.7522479, "period": "1914 - 1924", "description": "Genocidio asirio (conocido como Sayfo) perpetrado por las fuerzas otomanas y tropas irregulares kurdas en el contexto de la Primera Guerra Mundial. Movidos por el nacionalismo extremo y el celo religioso, masacraron a más de 250,000 asirios, destruyendo sus comunidades históricas en Anatolia y el norte de Mesopotamia."}, {"name": "ARMENIO", "region": "ASIA", "lat": 39.3697145, "lon": 35.1096792, "period": "1915 - 1923", "description": "Genocidio planificado y ejecutado por el gobierno de los Jóvenes Turcos en el Imperio Otomano. Con el objetivo de erradicar a la minoría cristiana armenia y crear un Estado homogéneo, masacraron a más de 1.5 millones de personas mediante ejecuciones en masa, deportaciones y marchas de la muerte por el desierto sirio."}, {"name": "PALESTINO", "region": "ASIA", "lat": 31.8259919, "lon": 34.9171905, "period": "1947 - Presente", "description": "Limpieza étnica y desplazamiento masivo forzado conocido como la Nakba (\"Catástrofe\"), perpetrados por milicias sionistas y las posteriores Fuerzas de Defensa de Israel. Impulsados por la creación de un Estado de mayoría judía, destruyeron más de 500 aldeas, perpetraron masacres (como Deir Yassin) y expulsaron a más de 700,000 personas de sus tierras."}, {"name": "INDONESIO*", "region": "ASIA", "lat": 1.0102042, "lon": 113.4885104, "period": "1965 - 1966", "description": "Masacre masiva sistemática y purga política anticomunista en Indonesia, perpetrada por el ejército dirigido por el general Suharto y milicias paramilitares locales. Impulsada por el régimen militar con apoyo de potencias occidentales para erradicar a la izquierda, las fuerzas estatales y paramilitares masacraron entre 500,000 y un millón de personas, encarcelaron a cientos de miles en campos de concentración e impusieron un régimen de terror y despojo permanente."}, {"name": "BENGALÍ", "region": "ASIA", "lat": 23.7778721, "lon": 89.9827206, "period": "1971", "description": "Genocidio y violencia masiva perpetrados por las Fuerzas Armadas de Pakistán y milicias aliadas en el actual Bangladés. Impulsados por el afán de reprimir el movimiento de independencia bengalí y mantener la hegemonía política del Pakistán Occidental, asesinaron a entre 300,000 y 3 millones de personas, sometieron a cientos de miles de mujeres a violaciones sistemáticas y provocaron la huida de millones de refugiados hacia la India."}, {"name": "CAMBOYANO", "region": "ASIA", "lat": 12.565679, "lon": 104.990963, "period": "1975 - 1979", "description": "Genocidio acometido por el régimen ultra-maoísta de los Jemeres Rojos, liderados por Pol Pot en Camboya. Movidos por una ingeniería social radical para refundar una sociedad agraria (\"Año Cero\"), ejecutaron, mataron de hambre y sometieron a trabajos forzados a cerca de dos millones de personas, ensañándose especialmente contra intelectuales, minorías étnicas (chams, vietnamitas) y monjes budistas."}, {"name": "TIMORENSE y PAPÚE", "region": "ASIA", "lat": -8.874217, "lon": 125.727539, "period": "1975 - 1999", "description": "Ocupación militar, represión y masacres perpetradas por la dictadura de Suharto y las fuerzas armadas indonesias en Timor Oriental y Papúa Occidental. Impulsadas por la expansión territorial y la explotación de recursos, las campañas militares mataron a más de 200,000 timorenses mediante ejecuciones, hambrunas provocadas y esterilizaciones forzadas, mientras continúan la colonización y represión sistemática en Papúa."}, {"name": "TURCOMANO CHIITA e IRAQUÍ", "region": "ASIA", "lat": 32.5198349, "lon": 45.1391526, "period": "1980 - 1991", "description": "Purgas, deportaciones masivas y ejecuciones sumarias cometidas por el régimen de Sadam Husein en Irak. Movidos por el recelo sectario, el panarabismo y el temor a la influencia iraní, las fuerzas estatales atacaron a la minoría turcomana y a la población chiita, destruyendo pueblos como Bashir, confiscando sus propiedades y ejecutando a miles de sus líderes comunitarios."}, {"name": "YAZIDÍ", "region": "ASIA", "lat": 35.2553743, "lon": 42.1948167, "period": "2014 - 2017", "description": "Genocidio perpetrado por la organización yihadista Estado Islámico (ISIS) en la región de Sinjar, Irak. Impulsados por el extremismo religioso que considera a los yazidíes como \"adoradores del diablo\", los militantes ejecutaron a miles de hombres, secuestraron y convirtieron en esclavas sexuales a miles de mujeres y niñas, y desplazaron a toda la comunidad."}, {"name": "ROHINGYANO", "region": "ASIA", "lat": 22.1465533, "lon": 93.3532536, "period": "2016 - Presente", "description": "Campaña de limpieza étnica y genocidio llevada a cabo por las Fuerzas Armadas de Birmania (Myanmar) y grupos extremistas locales. Motivados por el nacionalismo budista extremo y el rechazo a la ciudadanía de esta minoría musulmana, destruyeron cientos de aldeas, cometieron violaciones masivas e infligieron asesinatos sistemáticos, obligando a más de 700,000 rohingyas a huir a Bangladés."}, {"name": "KURDO", "region": "ASIA", "lat": 33.223191, "lon": 43.679291, "period": "1986 - 1989", "description": "Genocidio y campaña de limpieza étnica conocida como la Operación Anfal, ejecutada por el régimen baatista de Sadam Husein en el norte de Irak. Con el fin de erradicar la resistencia kurda y arabizar regiones estratégicas, el ejército iraquí empleó armas químicas contra civiles (como en el ataque a Halabja), destruyó miles de aldeas y ejecutó a más de 100,000 personas."}, {"name": "TUTSI", "region": "ÁFRICA", "lat": -2.02385, "lon": 30.878794, "period": "1994", "description": "Genocidio en Ruanda perpetrado por extremistas hutus (Hutu Power), las Fuerzas Armadas y las milicias Interahamwe. Impulsados por una ideología de odio étnico y el afán de conservar el poder, asesinaron de manera planificada y sistemática a cerca de 800,000 tutsis y hutus moderados en tan solo 100 días."}, {"name": "NDEBELE", "region": "ÁFRICA", "lat": -21.0503549, "lon": 29.0435323, "period": "1983 - 1987", "description": "Masacres sistemáticas conocidas como la Operación Gukurahundi, perpetradas por la Quinta Brigada del ejército de Zimbabue bajo el gobierno de Robert Mugabe. Con el fin de aplastar la oposición política del ZAPU y consolidar un Estado de partido único, miles de civiles ndebele fueron torturados, masacrados y sometidos a hambrunas artificiales."}, {"name": "TINGRAYANO", "region": "ÁFRICA", "lat": 14.0323336, "lon": 38.3165725, "period": "2020", "description": "Fuerzas armadas federales etíopes y eritreas llevaron a cabo masacres, violencia sexual y tácticas de exterminio, como causar hambrunas forzadas, contra los tigriños, justificándolas con motivos de seguridad (peligro de que exista el Frente de Liberación Popular de Tigray) y con lenguaje de deshumanización."}, {"name": "HUTU", "region": "ÁFRICA", "lat": -3.2819056, "lon": 30.0415522, "period": "1972 / 1993", "description": "Episodios de violencia genocida en Burundi, destacando la masacre de 1972 perpetrada por la élite militar Tutsi de Michel Micombero. Con el fin de asegurar la hegemonía política frente a la mayoría Hutu, se ejecutó de forma sistemática a profesionales, estudiantes y líderes comunitarios hutus."}, {"name": "PUEBLOS ORIGINARIOS DE LAS ISLAS CANARIAS*", "region": "ÁFRICA", "lat": 28.0227909, "lon": -15.6213685, "period": "1402 - 1496", "description": "Conquista, esclavización y asimilación forzada perpetrada por la Corona de Castilla y señores feudales europeos en las Islas Canarias. Impulsada por el afán de expansión territorial y control de rutas atlánticas, la población aborigen sufrió matanzas, deportación como mano de obra esclava y un colapso demográfico que llevó a su casi total erradicación cultural."}, {"name": "ACHOLI Y LANGI", "region": "ÁFRICA", "lat": 1.373333, "lon": 32.290275, "period": "1971 - 1979", "description": "Purgas étnicas y matanzas sistemáticas cometidas por la dictadura militar de Idi Amin Dada en Uganda. Motivado por la consolidación del poder autoritario y el rechazo a grupos leales al régimen anterior, el Estado ejecutó masivamente a militares y civiles de estas etnias en cuarteles y comunidades del norte del país."}, {"name": "BANTÚ, LUBA y LUNDA", "region": "ÁFRICA", "lat": -0.5702088, "lon": 14.9611646, "period": "1885 - 1908", "description": "Régimen de terror y explotación extrema en el Estado Libre del Congo, bajo el dominio personal del rey Leopoldo II de Bélgica. Movidos por la codicia de extracción de caucho y marfil, las fuerzas coloniales perpetraron mutilaciones, ejecuciones masivas, trabajo forzado e incentivo de hambrunas que cobraron la vida de millones de personas."}, {"name": "HERERO Y NAMA", "region": "ÁFRICA", "lat": -22.95764, "lon": 18.49041, "period": "1904 - 1908", "description": "Primer genocidio del siglo XX, perpetrado por el Imperio Alemán en África del Sudoeste (actual Namibia). Tras rebelarse contra la desposesión de sus tierras ganaderas, el ejército colonial emitió órdenes explícitas de exterminio, masacrando a la población, expulsándola al desierto para morir de sed y confinándola en campos de concentración."}, {"name": "ISAAQ", "region": "ÁFRICA", "lat": 5.152149, "lon": 46.199616, "period": "1987 - 1989", "description": "Genocidio y destrucción sistemática en Somalilandia perpetrados por la dictadura militar de Mohamed Siad Barre en Somalia. Para sofocar los movimientos de oposición en el norte, las fuerzas estatales bombardearon masivamente ciudades pobladas, masacraron a civiles e inutilizaron fuentes de agua."}, {"name": "NUBA, MASALIT, FUR, ZAGHAWA", "region": "ÁFRICA", "lat": 12.862807, "lon": 30.217636, "period": "1990 - Presente", "description": "Campañas de limpieza étnica y genocidio perpetradas por el gobierno de Sudán (encabezado por Omar al-Bashir) y las milicias Janjaweed. Impulsadas por disputas territoriales, despojo de tierras y políticas de arabización, las fuerzas estatales bombardearon aldeas, ejecutaron colectivamente a comunidades africanas no árabes y desplazaron a millones de personas."}, {"name": "BAMBUTI Y BATWA", "region": "ÁFRICA", "lat": -0.5513281, "lon": 24.199045, "period": "2002-2003", "description": "La operación «Effacer le tableau» fue llevada a cabo por el Movimiento de Liberación del Congo y el Rassemblement congolais pour la démocratie, RCD, contra distintos grupos, como los nande, o varios pueblos pigmeos como el pueblo mbuti (plural: bambuti) durante la Segunda Guerra del Congo, en las regiones de Kivu del norte e Ituri."}, {"name": "TIGRAYANO", "region": "ÁFRICA", "lat": 9.145, "lon": 40.489673, "period": "2020 - 2022", "description": "Campaña sistemática de limpieza étnica y crímenes de lesa humanidad perpetrada por los gobiernos de Etiopía y Eritrea junto a fuerzas aliadas durante el conflicto armado. El régimen utilizó bloqueos humanitarios absolutos, violencia sexual masiva como arma de guerra, destrucción de infraestructuras sanitarias y bombardeos deliberados para aniquilar a la población tigrayana."}];
const colors={"AMÉRICA":"#8b2635","OCEANÍA":"#28666e","EUROPA":"#4c5c68","ASIA":"#a45a52","ÁFRICA":"#5b6b3a"};
const map=L.map("map",{worldCopyJump:true,zoomControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const markers=[],markerByKey=new Map();
const list=document.getElementById("list"),search=document.getElementById("search"),region=document.getElementById("region"),count=document.getElementById("count");
[...new Set(places.map(p=>p.region))].sort().forEach(r=>{const o=document.createElement("option");o.value=r;o.textContent=r;region.appendChild(o);});
function key(p){return p.name+"|"+p.lat+"|"+p.lon}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
places.forEach(p=>{
 const marker=L.circleMarker([p.lat,p.lon],{radius:8,color:"#fff",weight:1.5,fillColor:colors[p.region]||"#7b1e2b",fillOpacity:.9});
 marker.bindPopup(`<div class="popup"><h3>${escapeHtml(p.name)}</h3><div class="period">${escapeHtml(p.period)}</div><p>${escapeHtml(p.description)}</p></div>`,{maxWidth:380});
 marker.addTo(map);markers.push({p:p,marker:marker});markerByKey.set(key(p),marker);
});
function renderList(){
 const q=search.value.trim().toLowerCase(),r=region.value;
 const filtered=places.filter(p=>(!r||p.region===r)&&(!q||(p.name+" "+p.period+" "+p.description+" "+p.region).toLowerCase().includes(q)));
 list.innerHTML="";
 filtered.forEach(p=>{
  const el=document.createElement("div");el.className="item";
  el.innerHTML=`<strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.region)} · ${escapeHtml(p.period)}</small>`;
  el.addEventListener("click",()=>{
   map.setView([p.lat,p.lon],Math.max(map.getZoom(),5),{animate:true});
   markerByKey.get(key(p)).openPopup();
   document.querySelectorAll(".item.active").forEach(x=>x.classList.remove("active"));el.classList.add("active");
  });list.appendChild(el);
 });
 count.textContent=`${filtered.length} de ${places.length} ubicaciones`;
 markers.forEach(obj=>{
  const p=obj.p,marker=obj.marker;
  const visible=(!r||p.region===r)&&(!q||(p.name+" "+p.period+" "+p.description+" "+p.region).toLowerCase().includes(q));
  if(visible)marker.addTo(map);else map.removeLayer(marker);
 });
}
search.addEventListener("input",renderList);region.addEventListener("change",renderList);
map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lon])).pad(0.08));renderList();
</script>
</body></html>
