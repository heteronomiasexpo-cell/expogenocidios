<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d2329;--muted:#66707a;--line:#dfe3e6;--accent:#7b1e2b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;min-height:59px}
h1{margin:0;font-family:'Krona One',sans-serif;font-size:19px;font-weight:400}.menu-toggle{border:1px solid #cfd5da;background:#fff;color:var(--ink);border-radius:8px;padding:8px 11px;font:400 12px 'Krona One',sans-serif;cursor:pointer;white-space:nowrap}.menu-toggle:hover{background:#f5ecee}.menu-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.layout.is-collapsed{grid-template-columns:minmax(0,1fr)}.layout.is-collapsed .sidebar{display:none}
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 59px);min-height:560px}
.sidebar{background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.controls{padding:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.97);z-index:5}
input,select{width:100%;padding:10px 11px;border:1px solid #cfd5da;border-radius:8px;font-size:14px;background:white;margin-bottom:8px}
.count{font-size:12px;color:var(--muted);margin:3px 0 8px}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#f5ecee}
.item strong{display:block;font-size:14px;margin-bottom:4px}.case-link{color:#7b1e2b;text-decoration:underline;text-underline-offset:3px}.case-link:hover{color:#54121e}.case-link:focus-visible{outline:2px solid #7b1e2b;outline-offset:2px}.item small{color:var(--muted)}
#map{min-width:0;min-height:560px}.legend{padding:10px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.popup h3{margin:0 0 5px;font-size:16px}.popup .period{color:var(--accent);font-weight:650;margin-bottom:8px}
.popup p{margin:0;line-height:1.45;font-size:13px}.leaflet-popup-content{max-width:360px}
@media(max-width:800px){header{padding:10px 12px}h1{font-size:14px}.layout{grid-template-columns:1fr;height:auto;min-height:0}.sidebar{max-height:48vh;border-right:0;border-bottom:1px solid var(--line)}#map{height:52vh;min-height:420px}.layout.is-collapsed #map{height:calc(100dvh - 59px);min-height:420px}}

#map{position:relative;overflow:hidden;background:#dbe9ed}#map svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#map svg:active{cursor:grabbing}.country{fill:#f2eee4;stroke:#a7b7ba;stroke-width:.55;vector-effect:non-scaling-stroke}.country:hover{fill:#e9e1d0}.country-label{font:600 10px system-ui,sans-serif;fill:#344550;paint-order:stroke;stroke:#fff;stroke-width:2.7px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}.graticule{fill:none;stroke:#afcbd0;stroke-width:.5;opacity:.65}.outline{fill:none;stroke:#526d76;stroke-width:1.1}.pin{cursor:pointer}.pin:hover{filter:drop-shadow(0 0 4px #222)}.popup{position:absolute;max-width:min(360px,calc(100% - 28px));background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px #1d232936;padding:15px;z-index:3;overflow-wrap:anywhere}.popup button{float:right;border:0;background:transparent;font-size:22px;cursor:pointer;color:#66707a;line-height:1}.popup p{white-space:pre-line}.zoom{position:absolute;right:14px;top:14px;display:grid;gap:5px;z-index:2}.zoom button{width:36px;height:36px;background:#fff;border:1px solid #ccd6d9;border-radius:7px;font-size:19px;cursor:pointer}.legend img{vertical-align:middle;object-fit:contain;width:17px;height:20px;margin-right:4px}.legend{line-height:2.1}</style>
</head>

const places=[{"name":"KINJA","region":"AMÉRICA","lat":-1.6565017,"lon":-61.257147,"period":"1968 - 1988","description":"Persecución militar y masacre sistemática llevada a cabo por la dictadura militar de Brasil y la Fundación Nacional del Indio (FUNAI) durante la construcción de la carretera BR-174. El régimen utilizó bombardeos, armas químicas y emboscadas para despojar sus tierras ancestrales amazónicas, reduciendo gravemente su población.","icon":"images/icon-1.png"},{"name":"PUEBLOS ORIGINARIOS DE CALIFORNIA*","region":"AMÉRICA","lat":34.5107678,"lon":-118.9932141,"period":"1846 - 1873","description":"Campaña exterminadora perpetrada por colonos estadounidenses, milicias estatales y el gobierno de California tras la Fiebre del Oro. Motivados por la ambición territorial, la búsqueda de metales y prejuicios raciales, masacraron a miles de indígenas, forzando además el trabajo esclavo de sobrevivientes y niños","icon":"images/icon-1.png"},{"name":"CHEROKEE, CHOCTAW, MUSCOGEE. SEMINOLE, CHICKASAW","region":"AMÉRICA","lat":35.9266285,"lon":-98.3054786,"period":"1830 - 1838","description":"Desplazamiento forzado masivo y limpieza étnica perpetrados por el gobierno estadounidense bajo la Ley de Expulsión de Indios. El Estado utilizó coerción militar, marchas forzadas bajo condiciones climáticas extremas, epidemias y privación de alimentos para despojar a estas naciones de sus territorios ancestrales, aniquilando a una fracción masiva de su población.","icon":"images/icon-1.png"},{"name":"UITOTO, MUINANE, OCAINO Y ANDOQUE","region":"AMÉRICA","lat":0.362255,"lon":-74.1495452,"period":"1900 - 1912","description":"Exterminio ejecutado por la compañía cauchera Peruvian Amazon Company liderada por Julio César Arana. Impulsado por el auge internacional de la extracción de caucho, el régimen perpetró torturas, mutilaciones, ejecuciones masivas y trabajo esclavo que aniquiló a decenas de miles de indígenas amazónicos.","icon":"images/icon-1.png"},{"name":"WENDAT","region":"AMÉRICA","lat":44.6379741,"lon":-84.3218874,"period":"1634 - 1650","description":"Campaña militar destructiva perpetrada por la Confederación Iroquesa, armada por comerciantes holandeses e ingleses. Motivada por el monopolio del comercio del pieles de castor y disputas territoriales, resultó en el desarraigo, la dispersión masiva y la rápida extinción social del pueblo Wendat.","icon":"images/icon-1.png"},{"name":"MEXICA","region":"AMÉRICA","lat":19.7151336,"lon":-98.6048034,"period":"1519 - 1521","description":"Masacres sistemáticas infligidas por los conquistadores españoles comandados por Hernán Cortés y sus aliados indígenas durante la conquista de Tenochtitlan. La codicia de riqueza, el control de la capital mexica y el afán de dominación desencadenaron epidemias, matanzas masivas y la destrucción total del imperio.","icon":"images/icon-1.png"},{"name":"QUECHUA Y AYMARA","region":"AMÉRICA","lat":-5.1359041,"lon":-76.0175378,"period":"1532 - 1783","description":"Sometimiento violento perpetrado por la Corona española y virreyes coloniales. Motivado por la explotación intensiva de plata y la hegemonía imperial, se implementó la mita minera, represión brutal de insurrecciones (como la de Túpac Amaru II) y la erradicación forzada del tejido socio-cultural nativo.","icon":"images/icon-1.png"},{"name":"PEQUOT","region":"AMÉRICA","lat":42.287261,"lon":-71.9516002,"period":"1636 - 1638","description":"Conflicto armado de exterminio perpetrado por colonos puritanos de Nueva Inglaterra y sus aliados nativos (Narragansett y Mohegan). Motivados por disputas comerciales, control del territorio y tensiones religiosas, quemaron aldeas enteras (como la Masacre de Fort Mystic), vendiendo a los supervivientes como esclavos","icon":"images/icon-1.png"},{"name":"RANQUEL, PAMPA Y TEHUELCHE","region":"AMÉRICA","lat":-34.7597414,"lon":-62.2020674,"period":"1878 - 1885","description":"Campaña militar conocida como la \"Campaña del Desierto\", ejecutada por el gobierno de Argentina al mando de Julio A. Roca. Motivada por la consolidación del Estado, la apropiación de tierras para la ganadería y el racismo, expulsó y eliminó sistemáticamente a las tribus pampeanas y patagónicas.","icon":"images/icon-1.png"},{"name":"YOEME","region":"AMÉRICA","lat":27.4407116,"lon":-109.9546656,"period":"1876 - 1910","description":"Política de exterminio y deportación masiva perpetrada por la dictadura de Porfirio Díaz en México. Impulsada por oligarcas terratenientes para despojarlos de las fértiles tierras del río Yaqui, miles de yoemes fueron masacrados y vendidos como mano de obra esclava a las plantaciones de Yucatán.","icon":"images/icon-1.png"},{"name":"ACHÉ","region":"AMÉRICA","lat":-23.4670889,"lon":-58.9961616,"period":"1968 - 1978","description":"Campaña de cacería humana y limpieza étnica llevada a cabo por civiles, estancieros y fuerzas de la dictadura paraguaya de Alfredo Stroessner. El afán por ocupar la cuenca oriental del río Paraná para agronegocios motivó asesinatos masivos, apropiación de niños y cautiverio en reservas.","icon":"images/icon-1.png"},{"name":"MAYA IXIL","region":"AMÉRICA","lat":15.0718843,"lon":-90.8174879,"period":"1981 - 1983","description":"Genocidio indígena perpetrado por las Fuerzas Armadas de Guatemala durante las dictaduras militares (especialmente bajo Efraín Ríos Montt). Bajo el pretexto del anticomunismo en el Conflicto Armado Interno, aplicaron una política de \"tierra arrasada\", destruyendo más de 400 aldeas mayas y masacrando comunidades enteras. Se estiman entre 100,000 y 200,000 víctimas.","icon":"images/icon-1.png"},{"name":"PUEBLOS ORIGINARIOS DEL CARIBE*","region":"AMÉRICA","lat":20.1146857,"lon":-73.9054553,"period":"1492 - 1518","description":"Exterminio devastador cometido por los colonizadores españoles encabezados por Cristóbal Colón y las encomiendas del Caribe. Movidos por la codicia insaciable de oro, esclavitud y sumisión religiosa, sometieron al pueblo taíno a trabajos forzados inhumanos y masacres que acabaron prácticamente con su población.","icon":"images/icon-1.png"},{"name":"MAPUCHE","region":"AMÉRICA","lat":-38.8501379,"lon":-72.3143124,"period":"1861 - 1883","description":"Proceso militar conocido como la \"Ocupación de la Araucanía\", llevado a cabo por el Estado chileno. Impulsado por la expansión agrícola y el nacionalismo territorial, el ejército invasor confiscó tierras ancestrales, quemó cosechas y masacró poblados para arrinconar al pueblo mapuche en reducciones.","icon":"images/icon-1.png"},{"name":"YANOMAMI","region":"AMÉRICA","lat":2.8828821,"lon":-64.0385453,"period":"1980 - Presente","description":"Persecución sistemática, despojo territorial y violencia letal perpetrados por redes de minería ilegal de oro (\"garimpeiros\"), con la complicidad u omisión estatal en Brasil y Venezuela. El régimen de invasión minera utilizó contaminación deliberada por mercurio de los ríos, destrucción de ecosistemas vitales, ataques armados y la introducción de enfermedades exógenas, diezmando gravemente a las comunidades originarias amazónicas.","icon":"images/icon-1.png"},{"name":"NAHUA","region":"AMÉRICA","lat":13.7322496,"lon":-88.6557475,"period":"1932","description":"Conocida como la \"Masacre de 1932\" en El Salvador, perpetrada por el régimen militar de Maximiliano Hernández Martínez. Tras una rebelión campesina iniciada por despojos agrarios, las fuerzas armadas masacraron a decenas de miles de indígenas nahuas, reprimiendo además su lenguaje, vestimenta y tradiciones.","icon":"images/icon-1.png"},{"name":"MORIORI","region":"OCEANÍA","lat":-40.900557,"lon":174.885971,"period":"1835 - 1860","description":"Genocidio y esclavización del pueblo moriori en las islas Chatham (Nueva Zelanda), perpetrados por guerreros maoríes de las tribus Ngāti Mutunga y Ngāti Tama, armados con tecnología europea. Facilitado por el compromiso moriori con el pacifismo absoluto (Nunuku), el ataque resultó en masacres, esclavitud y el exterminio del 90% de su población.","icon":"images/icon-2.png"},{"name":"PUEBLOS ORIGINARIOS DEL ESTRECHO DE TORRES","region":"OCEANÍA","lat":-23.8851054,"lon":135.2126131,"period":"1788 - Siglo XX","description":"Despojo territorial, masacres y políticas de asimilación forzada (como las \"Generaciones Robadas\") llevadas a cabo por el Imperio Británico y el gobierno australiano. Impulsados por el principio legal de Terra Nullius y el racismo institucional, arrebataron sus tierras ancestrales, apartaron a miles de niños de sus familias y destruyeron la estructura social de sus comunidades.","icon":"images/icon-2.png"},{"name":"IRLANDÉS","region":"EUROPA","lat":53.7632564,"lon":-7.1036969,"period":"1845 - 1852","description":"La Gran Hambruna (An Gorta Mór), agravada de forma sistemática por las políticas coloniales del Imperio Británico. Movidos por el dogma del libre mercado (laissez-faire) y prejuicios antibritánicos contra los católicos, los gobiernos británicos mantuvieron la exportación de alimentos fuera de Irlanda mientras un millón de personas morían de hambre y otro millón se veía forzado a emigrar.","icon":"images/icon-3.png"},{"name":"ROMANÍ Y SINTI","region":"EUROPA","lat":50.3605913,"lon":9.6782379,"period":"1939 - 1945","description":"Genocidio conocido como el Porrajmos (\"la devoración\"), perpetrado por la Alemania nazi y sus aliados fascistas en Europa. Impulsados por teorías de higiene racial y prejuicios ancestrales, los nazis persiguieron, esterilizaron, sometieron a experimentos médicos y masacraron a más de 500,000 gitanos en campos de exterminio y fusilamientos masivos.","icon":"images/icon-3.png"},{"name":"UCRANIANO","region":"EUROPA","lat":50.4934661,"lon":30.5380794,"period":"1930 - 1933","description":"Hambrunas masivas inducidas (Holodomor en Ucrania y Asharshylyq en Kazajistán), planificadas por el régimen soviético de José Stalin. Con el objetivo de imponer la colectivización forzada de la tierra y aplastar el nacionalismo campesino, el Estado requisó todo el grano y alimento existente, provocando la muerte por inanición de millones de personas.","icon":"images/icon-3.png"},{"name":"JUDÍO","region":"EUROPA","lat":50.9940065,"lon":9.9854061,"period":"1933 - 1945","description":"Genocidio industrializado llevado a cabo por el régimen nazi de Adolf Hitler en Europa. Impulsados por el antisemitismo, el supremacismo ario y el eugenismo, construyeron una red de campos de concentración y exterminio mediante los cuales asesinaron sistemáticamente a más de seis millones de judíos y millones de personas de otros grupos marginados.","icon":"images/icon-3.png"},{"name":"BOSNIO, SERBIO Y CROATA","region":"EUROPA","lat":44.0564627,"lon":19.7217526,"period":"1992 - 1995","description":"Limpiezas étnicas y genocidio (destacando la masacre de Srebrenica) perpetrados durante las Guerras de Yugoslavia, principalmente por fuerzas serbobosnias bajo el mando de Radovan Karadžić y Ratko Mladić. Movidos por un ultranacionalismo expansionista (\"la Gran Serbia\"), llevaron a cabo ejecuciones masivas, violaciones sistemáticas y desplazamientos forzados de poblaciones enteras.","icon":"images/icon-3.png"},{"name":"BOSNIO MUSULMÁN","region":"EUROPA","lat":41.8101472,"lon":21.0937311,"period":"1995","description":"En julio de 1995, durante la guerra de Bosnia (1992-1995) tras la desintegración de Yugoslavia, el ejército serbobosnio de la República Srpska comandado por Ratko Mladić asaltó el enclave de Srebrenica (declarado 'zona segura' de la ONU). En pocos días ejecutaron sistemáticamente a más de 8,000 hombres y adolescentes musulmanes bosniacos ('šehidi') y desplazaron por la fuerza a más de 25,000 mujeres y niños en una campaña de limpieza étnica.","icon":"images/icon-3.png"},{"name":"CIRCASIANO y PUEBLOS DEL NORTE DE CÁUCASO","region":"ASIA","lat":44.9634189,"lon":45.0042843,"period":"1860 - 1864","description":"Limpieza étnica y genocidio perpetrados por el Imperio Ruso bajo el mandato del zar Alejandro II al finalizar la Guerra del Cáucaso. Movido por el afán de anexión territorial y rusificación, el ejército imperial masacró a cientos de miles de circasianos, cabardinos, shapsug, natujai y ubij. Expulsó masivamente al resto de la población hacia el Imperio Otomano en barcos insalubres donde murieron por miles.","icon":"images/icon-4.png"},{"name":"AINÚ","region":"ASIA","lat":42.9979503,"lon":141.9447498,"period":"Siglo XVI - Siglo XX","description":"Despojo de tierras, erradicación cultural y asimilación forzada perpetrados por el gobierno del Imperio del Japón durante la Restauración Meiji. Motivados por el afán de anexión de la isla de Hokkaido y la homogenización nacional, prohibieron sus prácticas culturales, idioma y caza tradicional, despojándolos de sus derechos ancestrales.","icon":"images/icon-4.png"},{"name":"GRIEGO PÓNTICO","region":"ASIA","lat":40.6399776,"lon":40.498921,"period":"1914 - 1923","description":"Genocidio y limpiezas étnicas cometidas por el régimen de los Jóvenes Turcos y el posterior movimiento nacionalista turco en el Imperio Otomano. Impulsados por una ideología de turquificación y homogeneidad religiosa, sometieron a cientos de miles de griegos a marchas de la muerte, ejecuciones masivas y deportaciones forzadas.","icon":"images/icon-4.png"},{"name":"ASIRIO, CALDEO, ARAMEO Y SIRÍACO","region":"ASIA","lat":39.0291611,"lon":39.7522479,"period":"1914 - 1924","description":"Genocidio asirio (conocido como Sayfo) perpetrado por las fuerzas otomanas y tropas irregulares kurdas en el contexto de la Primera Guerra Mundial. Movidos por el nacionalismo extremo y el celo religioso, masacraron a más de 250,000 asirios, destruyendo sus comunidades históricas en Anatolia y el norte de Mesopotamia.","icon":"images/icon-4.png"},{"name":"ARMENIO","region":"ASIA","lat":39.3697145,"lon":35.1096792,"period":"1915 - 1923","description":"Genocidio planificado y ejecutado por el gobierno de los Jóvenes Turcos en el Imperio Otomano. Con el objetivo de erradicar a la minoría cristiana armenia y crear un Estado homogéneo, masacraron a más de 1.5 millones de personas mediante ejecuciones en masa, deportaciones y marchas de la muerte por el desierto sirio.","icon":"images/icon-4.png"},{"name":"PALESTINO","region":"ASIA","lat":31.8259919,"lon":34.9171905,"period":"1947 - Presente","description":"Limpieza étnica y desplazamiento masivo forzado conocido como la Nakba (\"Catástrofe\"), perpetrados por milicias sionistas y las posteriores Fuerzas de Defensa de Israel. Impulsados por la creación de un Estado de mayoría judía, destruyeron más de 500 aldeas, perpetraron masacres (como Deir Yassin) y expulsaron a más de 700,000 personas de sus tierras.","icon":"images/icon-4.png"},{"name":"INDONESIO*","region":"ASIA","lat":1.0102042,"lon":113.4885104,"period":"1965 - 1966","description":"Masacre masiva sistemática y purga política anticomunista en Indonesia, perpetrada por el ejército dirigido por el general Suharto y milicias paramilitares locales. Impulsada por el régimen militar con apoyo de potencias occidentales para erradicar a la izquierda, las fuerzas estatales y paramilitares masacraron entre 500,000 y un millón de personas, encarcelaron a cientos de miles en campos de concentración e impusieron un régimen de terror y despojo permanente.","icon":"images/icon-4.png"},{"name":"BENGALÍ","region":"ASIA","lat":23.7778721,"lon":89.9827206,"period":"1971","description":"Genocidio y violencia masiva perpetrados por las Fuerzas Armadas de Pakistán y milicias aliadas en el actual Bangladés. Impulsados por el afán de reprimir el movimiento de independencia bengalí y mantener la hegemonía política del Pakistán Occidental, asesinaron a entre 300,000 y 3 millones de personas, sometieron a cientos de miles de mujeres a violaciones sistemáticas y provocaron la huida de millones de refugiados hacia la India.","icon":"images/icon-4.png"},{"name":"CAMBOYANO","region":"ASIA","lat":12.565679,"lon":104.990963,"period":"1975 - 1979","description":"Genocidio acometido por el régimen ultra-maoísta de los Jemeres Rojos, liderados por Pol Pot en Camboya. Movidos por una ingeniería social radical para refundar una sociedad agraria (\"Año Cero\"), ejecutaron, mataron de hambre y sometieron a trabajos forzados a cerca de dos millones de personas, ensañándose especialmente contra intelectuales, minorías étnicas (chams, vietnamitas) y monjes budistas.","icon":"images/icon-4.png"},{"name":"TIMORENSE","region":"ASIA","lat":-8.874217,"lon":125.727539,"period":"1975 - 1999","description":"Ocupación militar, represión y masacres perpetradas por la dictadura de Suharto y las fuerzas armadas indonesias en Timor Oriental y Papúa Occidental. Impulsadas por la expansión territorial y la explotación de recursos, las campañas militares mataron a más de 200,000 timorenses mediante ejecuciones, hambrunas provocadas y esterilizaciones forzadas, mientras continúan la colonización y represión sistemática en Papúa.","icon":"images/icon-4.png"},{"name":"TURCOMANO CHIITA e IRAQUÍ","region":"ASIA","lat":32.5198349,"lon":45.1391526,"period":"1980 - 1991","description":"Purgas, deportaciones masivas y ejecuciones sumarias cometidas por el régimen de Sadam Husein en Irak. Movidos por el recelo sectario, el panarabismo y el temor a la influencia iraní, las fuerzas estatales atacaron a la minoría turcomana y a la población chiita, destruyendo pueblos como Bashir, confiscando sus propiedades y ejecutando a miles de sus líderes comunitarios.","icon":"images/icon-4.png"},{"name":"YAZIDÍ","region":"ASIA","lat":35.2553743,"lon":42.1948167,"period":"2014 - 2017","description":"Genocidio perpetrado por la organización yihadista Estado Islámico (ISIS) en la región de Sinjar, Irak. Impulsados por el extremismo religioso que considera a los yazidíes como \"adoradores del diablo\", los militantes ejecutaron a miles de hombres, secuestraron y convirtieron en esclavas sexuales a miles de mujeres y niñas, y desplazaron a toda la comunidad.","icon":"images/icon-4.png"},{"name":"ROHINGYANO","region":"ASIA","lat":22.1465533,"lon":93.3532536,"period":"2016 - Presente","description":"Campaña de limpieza étnica y genocidio llevada a cabo por las Fuerzas Armadas de Birmania (Myanmar) y grupos extremistas locales. Motivados por el nacionalismo budista extremo y el rechazo a la ciudadanía de esta minoría musulmana, destruyeron cientos de aldeas, cometieron violaciones masivas e infligieron asesinatos sistemáticos, obligando a más de 700,000 rohingyas a huir a Bangladés.","icon":"images/icon-4.png"},{"name":"KURDO","region":"ASIA","lat":33.223191,"lon":43.679291,"period":"1986 - 1989","description":"Genocidio y campaña de limpieza étnica conocida como la Operación Anfal, ejecutada por el régimen baatista de Sadam Husein en el norte de Irak. Con el fin de erradicar la resistencia kurda y arabizar regiones estratégicas, el ejército iraquí empleó armas químicas contra civiles (como en el ataque a Halabja), destruyó miles de aldeas y ejecutó a más de 100,000 personas.","icon":"images/icon-4.png"},{"name":"KAZAJO","region":"ASIA","lat":48.019573,"lon":66.923684,"period":"1930–1933","description":"La desastrosa colectivización forzosa de la tierra y la confiscación masiva de ganado impuestas por el régimen soviético de Iósif Stalin diezmaron radicalmente a la población nómada kazaja. Esta política criminal destruyó el tradicional modo de vida pastoril, provocando una catastrófica hambruna y la trágica muerte por inanición y enfermedades de más de un tercio de sus habitantes en pocos años.","icon":"images/icon-4.png"},{"name":"PAPÚ","region":"ASIA","lat":-1.3361154,"lon":133.1747162,"period":"1962–Presente","description":"La ocupación militar y la anexión forzada de Papúa Occidental por parte de Indonesia —avalada por potencias occidentales durante la Guerra Fría— han desencadenado un genocidio de carácter lento. Este proceso combina masacres sistemáticas, torturas, desplazamiento forzado y una colonización demográfica masiva destinada a destruir la identidad melanesia y saquear sus recursos naturales.","icon":"images/icon-4.png"},{"name":"TUTSI","region":"ÁFRICA","lat":-2.02385,"lon":30.878794,"period":"1994","description":"Genocidio en Ruanda perpetrado por extremistas hutus (Hutu Power), las Fuerzas Armadas y las milicias Interahamwe. Impulsados por una ideología de odio étnico y el afán de conservar el poder, asesinaron de manera planificada y sistemática a cerca de 800,000 tutsis y hutus moderados en tan solo 100 días.","icon":"images/icon-5.png"},{"name":"NDEBELE","region":"ÁFRICA","lat":-21.0503549,"lon":29.0435323,"period":"1983 - 1987","description":"Masacres sistemáticas conocidas como la Operación Gukurahundi, perpetradas por la Quinta Brigada del ejército de Zimbabue bajo el gobierno de Robert Mugabe. Con el fin de aplastar la oposición política del ZAPU y consolidar un Estado de partido único, miles de civiles ndebele fueron torturados, masacrados y sometidos a hambrunas artificiales.","icon":"images/icon-5.png"},{"name":"HUTU","region":"ÁFRICA","lat":-3.2819056,"lon":30.0415522,"period":"1972 / 1993","description":"Episodios de violencia genocida en Burundi, destacando la masacre de 1972 perpetrada por la élite militar Tutsi de Michel Micombero. Con el fin de asegurar la hegemonía política frente a la mayoría Hutu, se ejecutó de forma sistemática a profesionales, estudiantes y líderes comunitarios hutus.","icon":"images/icon-5.png"},{"name":"PUEBLOS ORIGINARIOS DE LAS CANARIAS*","region":"ÁFRICA","lat":28.0227909,"lon":-15.6213685,"period":"1402 - 1496","description":"Conquista, esclavización y asimilación forzada perpetrada por la Corona de Castilla y señores feudales europeos en las Islas Canarias. Impulsada por el afán de expansión territorial y control de rutas atlánticas, la población aborigen sufrió matanzas, deportación como mano de obra esclava y un colapso demográfico que llevó a su casi total erradicación cultural.","icon":"images/icon-5.png"},{"name":"ACHOLI Y LANGI","region":"ÁFRICA","lat":1.373333,"lon":32.290275,"period":"1971 - 1979","description":"Purgas étnicas y matanzas sistemáticas cometidas por la dictadura militar de Idi Amin Dada en Uganda. Motivado por la consolidación del poder autoritario y el rechazo a grupos leales al régimen anterior, el Estado ejecutó masivamente a militares y civiles de estas etnias en cuarteles y comunidades del norte del país.","icon":"images/icon-5.png"},{"name":"BANTÚ, LUBA y LUNDA","region":"ÁFRICA","lat":-0.5702088,"lon":14.9611646,"period":"1885 - 1908","description":"Régimen de terror y explotación extrema en el Estado Libre del Congo, bajo el dominio personal del rey Leopoldo II de Bélgica. Movidos por la codicia de extracción de caucho y marfil, las fuerzas coloniales perpetraron mutilaciones, ejecuciones masivas, trabajo forzado e incentivo de hambrunas que cobraron la vida de millones de personas.","icon":"images/icon-5.png"},{"name":"HERERO Y NAMA","region":"ÁFRICA","lat":-22.95764,"lon":18.49041,"period":"1904 - 1908","description":"Primer genocidio del siglo XX, perpetrado por el Imperio Alemán en África del Sudoeste (actual Namibia). Tras rebelarse contra la desposesión de sus tierras ganaderas, el ejército colonial emitió órdenes explícitas de exterminio, masacrando a la población, expulsándola al desierto para morir de sed y confinándola en campos de concentración.","icon":"images/icon-5.png"},{"name":"ISAAQ","region":"ÁFRICA","lat":5.152149,"lon":46.199616,"period":"1987 - 1989","description":"Genocidio y destrucción sistemática en Somalilandia perpetrados por la dictadura militar de Mohamed Siad Barre en Somalia. Para sofocar los movimientos de oposición en el norte, las fuerzas estatales bombardearon masivamente ciudades pobladas, masacraron a civiles e inutilizaron fuentes de agua.","icon":"images/icon-5.png"},{"name":"NUBA, MASALIT, FUR, ZAGHAWA","region":"ÁFRICA","lat":12.862807,"lon":30.217636,"period":"1990 - Presente","description":"Campañas de limpieza étnica y genocidio perpetradas por el gobierno de Sudán (encabezado por Omar al-Bashir) y las milicias Janjaweed. Impulsadas por disputas territoriales, despojo de tierras y políticas de arabización, las fuerzas estatales bombardearon aldeas, ejecutaron colectivamente a comunidades africanas no árabes y desplazaron a millones de personas.","icon":"images/icon-5.png"},{"name":"BAMBUTI Y BATWA","region":"ÁFRICA","lat":-0.5513281,"lon":24.199045,"period":"2002-2003","description":"La operación «Effacer le tableau» fue llevada a cabo por el Movimiento de Liberación del Congo y el Rassemblement congolais pour la démocratie, RCD, contra distintos grupos, como los nande, o varios pueblos pigmeos como el pueblo mbuti (plural: bambuti) durante la Segunda Guerra del Congo, en las regiones de Kivu del norte e Ituri.","icon":"images/icon-5.png"},{"name":"TIGRAYANO","region":"ÁFRICA","lat":14.0509661,"lon":38.3472489,"period":"2020 - 2022","description":"Campaña sistemática de limpieza étnica y crímenes de lesa humanidad perpetrada por los gobiernos de Etiopía y Eritrea junto a fuerzas aliadas durante el conflicto armado. El régimen utilizó bloqueos humanitarios absolutos, violencia sexual masiva como arma de guerra, destrucción de infraestructuras sanitarias y bombardeos deliberados para aniquilar a la población tigrayana.","icon":"images/icon-5.png"}];

const svg=d3.select(mapEl).insert('svg',':first-child').attr('role','img').attr('aria-label','Mapa mundial Equal Earth');
const scene=svg.append('g');const base=scene.append('g');const points=svg.append('g');const labels=svg.append('g').attr('aria-label','Nombres de países');let countries=[];
let projection=d3.geoEqualEarth(), path=d3.geoPath(projection), transform=d3.zoomIdentity, selected=null;
const zoom=d3.zoom().scaleExtent([1,12]).on('zoom',e=>{transform=e.transform;scene.attr('transform',transform);updatePins();updateLabels();positionPopup()});svg.call(zoom);
function resize(){let w=mapEl.clientWidth,h=mapEl.clientHeight;svg.attr('viewBox',`0 0 ${w} ${h}`);projection.fitExtent([[22,22],[w-22,h-22]],{type:'Sphere'});path=d3.geoPath(projection);base.selectAll('path').attr('d',path);updatePins();updateLabels();positionPopup()}
function updatePins(){const size=Math.min(40,20*Math.sqrt(transform.k));points.selectAll('image').attr('width',size).attr('height',size).attr('x',p=>transform.applyX(projection([p.lon,p.lat])[0])-size/2).attr('y',p=>transform.applyY(projection([p.lon,p.lat])[1])-size)}
function updateLabels(){
 if(!countries.length)return;
 const placed=[],w=mapEl.clientWidth,h=mapEl.clientHeight;
 const candidates=countries.map(c=>{const area=path.area(c)*transform.k*transform.k;const center=projection(d3.geoCentroid(c));return {c,area,x:transform.applyX(center[0]),y:transform.applyY(center[1])}}).sort((a,b)=>b.area-a.area);
 const shown=[];
 for(const item of candidates){
  const {c,area,x,y}=item,name=countryNames[c.properties?.name]||c.properties?.name||'';
  if(area<850||x<12||x>w-12||y<12||y>h-12||!name)continue;
  const tw=Math.max(35,name.length*5.9),rect={l:x-tw/2,r:x+tw/2,t:y-7,b:y+7};
  if(placed.some(v=>rect.l<v.r+6&&rect.r>v.l-6&&rect.t<v.b+4&&rect.b>v.t-4))continue;
  placed.push(rect);shown.push({id:c.id,name,x,y});
 }
 labels.selectAll('text').data(shown,d=>d.id).join('text').attr('class','country-label').attr('x',d=>d.x).attr('y',d=>d.y).text(d=>d.name);
}
function positionPopup(){if(selected===null||popup.hidden)return;let p=places[selected],xy=projection([p.lon,p.lat]);let x=transform.applyX(xy[0]),y=transform.applyY(xy[1]);let pw=popup.offsetWidth||320,ph=popup.offsetHeight||160;popup.style.left=Math.max(8,Math.min(mapEl.clientWidth-pw-8,x+12))+'px';popup.style.top=Math.max(8,Math.min(mapEl.clientHeight-ph-8,y-ph-10))+'px'}
function openItem(i){selected=i;const p=places[i];popup.innerHTML=`<button aria-label="Cerrar ficha" id="close">×</button><h3>${linkedName(p)}</h3><div class="period">${esc(p.period)}</div><p>${esc(p.description)}</p>`;popup.hidden=false;popup.querySelector('#close').onclick=()=>{popup.hidden=true;selected=null};document.querySelectorAll('.item.active').forEach(e=>e.classList.remove('active'));document.querySelector(`.item[data-index="${i}"]`)?.classList.add('active');positionPopup()}
const markers=points.selectAll('image').data(places).join('image').attr('href',p=>icons[p.icon]).attr('class','pin').attr('tabindex',0).attr('role','button').attr('aria-label',p=>p.name).on('click',(e,p)=>{e.stopPropagation();openItem(places.indexOf(p))}).on('keydown',(e,p)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openItem(places.indexOf(p))}});
svg.on('click',()=>{popup.hidden=true;selected=null});
function render(){const q=fold(search.value.trim()),r=region.value,visible=[];list.replaceChildren();places.forEach((p,i)=>{let ok=(!r||p.region===r)&&(!q||fold([p.name,p.region,p.period,p.description].join(' ')).includes(q));if(!ok)return;visible.push(i);let el=document.createElement('div');el.className='item'+(selected===i?' active':'');el.dataset.index=i;el.tabIndex=0;el.innerHTML=`<strong>${linkedName(p)}</strong><small>${esc(p.region)} · ${esc(p.period)}</small>`;el.querySelector('a')?.addEventListener('click',e=>e.stopPropagation());el.onclick=()=>{openItem(i);const xy=projection([p.lon,p.lat]);svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity.translate(mapEl.clientWidth/2-xy[0]*Math.max(1.8,transform.k),mapEl.clientHeight/2-xy[1]*Math.max(1.8,transform.k)).scale(Math.max(1.8,transform.k)))};el.onkeydown=e=>{if(e.key==='Enter')el.click()};list.appendChild(el)});const shown=new Set(visible);markers.style('display',(p,i)=>shown.has(i)?null:'none');count.textContent=`${visible.length} de ${places.length} ubicaciones`;if(selected!==null&&!shown.has(selected)){selected=null;popup.hidden=true}}
search.addEventListener('input',render);region.addEventListener('change',render);document.getElementById('plus').onclick=()=>svg.transition().call(zoom.scaleBy,1.5);document.getElementById('minus').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.5);document.getElementById('reset').onclick=()=>svg.transition().call(zoom.transform,d3.zoomIdentity);
base.append('path').datum(d3.geoGraticule10()).attr('class','graticule');base.append('path').datum({type:'Sphere'}).attr('class','outline');
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(world=>{countries=topojson.feature(world,world.objects.countries).features;base.selectAll('.country').data(countries).join('path').attr('class','country').append('title').text(d=>countryNames[d.properties?.name]||d.properties?.name||'');resize()}).catch(()=>{let n=document.createElement('div');n.style.cssText='position:absolute;bottom:10px;left:12px;background:white;padding:6px;border-radius:5px;font-size:12px';n.textContent='No se pudieron cargar los límites de los países. Los puntos siguen disponibles.';mapEl.appendChild(n)});
new ResizeObserver(resize).observe(mapEl);resize();render();
</script></body></html>
